name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: dogfood the installed CLI on this repo
        run: |
          pip install .
          slopcheck --version
          slopcheck . --exclude tests --fail-on low
