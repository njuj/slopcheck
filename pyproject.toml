[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slopcheck"
dynamic = ["version"]
description = "Catch hallucinated packages (slopsquatting), typosquats, leaked secrets and the classic security slips of AI-written code."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "kira", email = "286490266+njuj@users.noreply.github.com" }]
keywords = ["security", "supply-chain", "slopsquatting", "typosquatting", "ai", "llm", "secrets", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/njuj/slopcheck"

[project.scripts]
slopcheck = "slopcheck.cli:main"

[tool.setuptools.dynamic]
version = { attr = "slopcheck.__version__" }

[tool.setuptools.packages.find]
include = ["slopcheck*"]

